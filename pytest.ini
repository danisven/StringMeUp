[pytest]
# Pytest configuration for StringMeUp

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# Markers for categorizing tests
markers =
    critical: Critical tests for core functionality (v0.2.0 bug fix)
    regression: Regression tests documenting bug fixes
    edge_case: Edge case and boundary condition tests
    integration: End-to-end integration tests
    slow: Tests that take longer to run

# Coverage options (if pytest-cov is installed)
# addopts = --cov=stringmeup --cov-report=html --cov-report=term

# Warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
